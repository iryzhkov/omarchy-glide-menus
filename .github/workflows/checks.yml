name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # qmllint and qmltestrunner both come from Qt 6's declarative tools. The
      # Omarchy shell is not present here, so the qs.Commons and qs.Ui imports
      # do not resolve; scripts/lint judges accordingly, which is what lets the
      # same command be run here and on a desktop.
      #
      # Ubuntu splits the QML modules finely and apt pulls none of them in, so
      # TestCase's own dependency tree has to be spelled out. The two that are
      # not obvious: workerscript, because a `.pragma library` script is loaded
      # through that machinery and every extracted module is one; and
      # quick-window, because TestCase itself imports it. Missing either makes
      # every test fail at compile with a message about an uninstalled module
      # rather than about the test.
      - name: Install Qt 6 QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-declarative-dev-tools \
            qml6-module-qttest \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            qml6-module-qtqml-models \
            qml6-module-qtquick \
            qml6-module-qtquick-window

      - name: Lint
        run: scripts/lint

      - name: Test
        run: scripts/test
