; qmllint configuration for an Omarchy Quickshell plugin.
;
; The categories disabled below are not defects. They are the cost of linting a
; Quickshell plugin outside a running Quickshell: qmllint resolves plain Qt
; types, but Quickshell's own types (PanelWindow, Process, IpcHandler) and
; Omarchy's shell singletons (qs.Commons, qs.Ui) are registered by the host at
; runtime, so every reference to one looks unresolved from here. Leaving them
; on would bury the categories that do find real defects.
;
; Everything not listed stays at its default, which for nearly all of them is
; `warning` -- and scripts/lint treats any warning as a failure. The ones that
; earn their keep on this codebase: ReadOnlyProperty (assigning through a
; readonly alias), IncompatibleType, DuplicatePropertyBinding, UnusedImports,
; Deprecated, and the JavaScript checks (Eval, AssignmentInCondition,
; VarUsedBeforeDeclaration, UnreachableCode).

[General]
DisableDefaultImports=false
; Left at qmllint's own default. scripts/lint decides the verdict from what
; qmllint printed, because the flag that would make the exit code carry it
; is not present in every Qt 6 qmllint.
MaxWarnings=-1

[Warnings]
; qs.Commons and qs.Ui live in the installed Omarchy shell, which is present on
; a desktop and absent on a CI runner. scripts/lint points qmllint at it when it
; is there; the lint must not change verdict depending on which machine it runs
; on, so a failure to import is never the failure.
ImportFailure=disable

; Quickshell registers these types and their members from C++ at runtime.
MissingProperty=disable
MissingType=disable
UncreatableType=disable
UnresolvedType=disable
; Process.exited carries a QProcess::ExitStatus, which is not a QML type.
BadSignalHandlerParameters=disable

; Real, and deliberately not a gate yet: a nested component reaching an outer
; id needs `pragma ComponentBehavior: Bound`. There are enough of these that
; turning them on now would make the gate red on arrival and train everyone to
; ignore it. Fix them, then delete this line.
UnqualifiedAccess=disable
